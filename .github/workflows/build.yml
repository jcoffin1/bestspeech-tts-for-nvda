name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - audit/bestspeech
    tags:
      - "*"
permissions:
  contents: read
jobs:
  windows_build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pip3 install scons
        scons -s
        python tests/test_driver.py
        python tests/test_helper.py
        cp bin/*.dll nvda/synthDrivers
        cp bin/b32_helper.exe nvda/synthDrivers
        Copy-Item -LiteralPath LICENSE, deps.txt -Destination nvda
        mkdir b32_assets
        cd bin
        7z a -tzip ../b32_assets/b32_bin.zip *.dll b32_spk.exe b32_helper.exe
        cd ..
        7z a -tzip b32_assets/b32_bin.zip LICENSE deps.txt
        cd nvda
        7z a -tzip ../b32_assets/bestspeech.nvda-addon *
        cd ..
        python tests/validate_package.py b32_assets/bestspeech.nvda-addon
    - uses: actions/upload-artifact@v4
      with:
        name: b32_assets
        path: 'b32_assets'
  publish_release:
    needs: ["windows_build"]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
    - uses: ghalactic/github-release-from-tag@v5
      with:
        checksumGenerateAssets: "true"
        assets: |
          - path: b32_assets/b32_bin.zip
            name: b32_bin_${{github.ref_name}}.zip
          - path: b32_assets/bestspeech.nvda-addon
            name: bestspeech_${{github.ref_name}}.nvda-addon
