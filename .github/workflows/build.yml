name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - audit/bestspeech
    tags:
      - "*"
permissions:
  contents: read
jobs:
  windows_build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pip3 install scons
        scons -s
        python tests/test_driver.py
        python tests/test_helper.py
        python tests/build_packages.py
        python tests/validate_package.py b32_assets/bestspeech.nvda-addon
    - uses: actions/upload-artifact@v7
      with:
        name: b32_assets
        path: 'b32_assets'
        if-no-files-found: error
  publish_release:
    needs: ["windows_build"]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: b32_assets
        path: b32_assets
    - name: Publish validated release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" b32_assets/* \
          --verify-tag --title "BeSTSpeech TTS for NVDA ${GITHUB_REF_NAME#v}" \
          --notes-file RELEASE-NOTES.md
